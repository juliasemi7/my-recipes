        /* =====================================================================

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function pluralPortions(n) {
            const a = Math.abs(n) % 100, b = a % 10;
            if (a > 10 && a < 20) return `${n} порций`;
            if (b === 1) return `${n} порция`;
            if (b >= 2 && b <= 4) return `${n} порции`;
            return `${n} порций`;
        }

        // Масштабирование количества: поддерживает "200", "1,5", "1/2", "2-3", "по вкусу"
        function scaleAmount(amount, mult) {
            const str = String(amount ?? '');
            if (mult === 1) return str;
            return str.replace(/(\d+)\s*\/\s*(\d+)|\d+(?:[.,]\d+)?/g, (m, a, b) => {
                let v = b ? parseInt(a, 10) / parseInt(b, 10) : parseFloat(m.replace(',', '.'));
                v *= mult;
                return String(Math.round(v * 100) / 100).replace('.', ',');
            });
        }

        // Длительность шага из текста: «25 минут», «2,5 минуты», «10–15 мин», «1 час 30 минут», «около часа», «30 секунд»
        function parseStepSeconds(text) {
            const t = String(text || '').toLowerCase().replace(/ё/g, 'е');
            const re = /(\d+(?:[.,]\d+)?)(?:\s*[-–—]\s*(\d+(?:[.,]\d+)?))?\s*(час[а-я]*|ч(?![а-я])|минут[а-я]*|мин(?![а-я])|секунд[а-я]*|сек(?![а-я]))/g;
            const found = [];
            let m;
            while ((m = re.exec(t))) {
                const val = parseFloat((m[2] || m[1]).replace(',', '.'));
                const unit = m[3];
                const mult = /^(час|ч)/.test(unit) ? 3600 : /^(мин)/.test(unit) ? 60 : 1;
                found.push({ sec: Math.round(val * mult), mult, end: m.index + m[0].length, start: m.index });
            }
            if (found.length) {
                const first = found[0];
                const next = found[1];
                // «1 час 30 минут» — складываем часы и минуты, идущие подряд
                if (first.mult === 3600 && next && next.mult === 60 && next.start - first.end <= 6) return first.sec + next.sec;
                return first.sec > 0 ? first.sec : null;
            }
            if (/полтора\s+час/.test(t)) return 5400;
            if (/полчаса/.test(t)) return 1800;
            if (/(?:^|[^а-я])час(?:а)?(?![а-я])/.test(t)) return 3600;
            return null;
        }

        function fmtDuration(sec) {
            sec = Math.round(sec);
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            const parts = [];
            if (h) parts.push(h + ' ч');
            if (m) parts.push(m + ' мин');
            if (s && !h) parts.push(s + ' сек');
            return parts.join(' ') || '0 сек';
        }

        function fmtClock(sec) {
            sec = Math.max(0, Math.round(sec));
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
            return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;

        // Безопасная нормализация рецепта (из ссылки или из файла): только строки, ограничения по длине

        // Кодирование/декодирование для персональной ссылки (UTF-8 → base64url; старые ссылки тоже читаются)
        function encodeShare(obj) {
            const bytes = new TextEncoder().encode(JSON.stringify(obj));
            let bin = '';
            bytes.forEach(b => bin += String.fromCharCode(b));
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function decodeShare(payload) {
            let p = payload;
            try { p = decodeURIComponent(payload); } catch (e) { /* оставляем как есть */ }
            p = p.replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
            while (p.length % 4) p += '=';
            const bin = atob(p);
            if (bin.startsWith('%')) return JSON.parse(decodeURIComponent(bin)); // старый формат
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            return JSON.parse(new TextDecoder().decode(bytes));
        }

        const CATEGORY_LIST = ['Супы', 'Горячее', 'Салаты', 'Закуски', 'Десерты', 'Выпечка', 'Завтраки', 'Дополнительно'];
        const SUBCATEGORY_MAP = {

        const UNIT_SRC = [

        const UNIT_END = '(?=$|[\\s,;)(])';

        const RE_AMOUNT_FIRST = new RegExp('^(' + NUM + ')\\s*(?:(' + UNIT_SRC + ')\\.?' + UNIT_END + ')?\\s*(.*)$', 'i');
        const RE_AMOUNT_LAST = new RegExp('^(.*?)\\s*[-–—:,]?\\s*(' + NUM + ')\\s*(?:(' + UNIT_SRC + ')\\.?)?\\s*$', 'i');
        const RE_VAGUE_LAST = /^(.*?)\s*[-–—:,]?\s*(по\s+вкусу|на\s+глаз|для\s+подачи|для\s+жарки|для\s+украшения|по\s+желанию|щепотк[а-яё]*|немного)\s*$/i;
        const RE_VAGUE_FIRST = /^(щепотк[а-яё]*|немного|пара|горсть|пучок|несколько)\s+(.+)$/i;

        };

        function parseIngredient(rawLine) {
            let line = rawLine
                .replace(/½/g, '0.5').replace(/¼/g, '0.25').replace(/¾/g, '0.75')

            // Примечание в скобках переносим в название
            let note = '';
            line = line.replace(/\(([^)]*)\)/g, (m, g) => { note += (note ? ', ' : '') + g.trim(); return ' '; }).trim();
            const withNote = (name) => cleanName(name) + (note ? ` (${note})` : '');

            let m = line.match(RE_VAGUE_FIRST);
            if (m && !/^\d/.test(m[2])) {
                return { name: withNote(m[2]), amount: m[1].toLowerCase(), unit: '' };
            }

            m = line.match(RE_AMOUNT_FIRST);
            if (m) {
                const unit = normalizeUnit(m[2]);
                const name = m[3].replace(/^(?:из|of)\s+/i, '');
                if (name.trim() || unit) {
                    return { name: withNote(name || 'Ингредиент'), amount: m[1].replace(/\s+/g, '').replace(',', '.'), unit: unit || (name.trim() ? 'шт' : '') };
                }
            }

            m = line.match(RE_AMOUNT_LAST);
            if (m && cleanName(m[1])) {
                return { name: withNote(m[1]), amount: m[2].replace(/\s+/g, '').replace(',', '.'), unit: normalizeUnit(m[3]) };
            }

            m = line.match(RE_VAGUE_LAST);
            if (m && cleanName(m[1])) {
                return { name: withNote(m[1]), amount: m[2].toLowerCase(), unit: '' };
            }

            return { name: withNote(line), amount: 'по вкусу', unit: '', _unparsed: true };
        }

        const RE_ING_HEADER = /^(?:ингредиент[а-яё]*|состав|продукты|что\s+нужно|нам\s+понадобится|понадобится|необходимые\s+продукты|для\s+приготовления)$/;
        const RE_STEP_HEADER = /^(?:способ\s+приготовления|приготовление|как\s+готовить|шаги|инструкция(?:\s+по\s+приготовлению)?|рецепт\s+приготовления|процесс\s+приготовления|порядок\s+действий|этапы(?:\s+приготовления)?|метод\s+приготовления|как\s+приготовить|пошаговый\s+рецепт(?:\s+приготовления)?|рецепт\s+пошагово)$/;

        function headerInfo(line) {
            // Заголовок = короткая строка, состоящая только из ключевого слова (с необязательным "на N порций" и двоеточием)
            if (line.length > 70) return null;
            let t = line.toLowerCase()
                .replace(/^[#*_\s>]+/, '')
                .replace(/[*_:：\s]+$/, '');
            let servings = null;
            t = t.replace(/\(([^)]*)\)/g, ' $1 ');
            const sm = t.match(/(?:^|\s)(?:на|для)\s+(\d+)\s*(?:порци[а-яё]*|персон[а-яё]*|человек[а-яё]*)?\s*$/);
            if (sm) { servings = parseInt(sm[1], 10); t = t.slice(0, sm.index); }
            t = t.replace(/[\s:：\-–—]+$/, '').trim();
            if (RE_ING_HEADER.test(t)) return { type: 'ingredients', servings };
            if (RE_STEP_HEADER.test(t)) return { type: 'steps', servings };
            return null;
        }

        // Строки-«хвосты» страниц: после них рецепта уже нет
        const RE_STOP_LINE = /^(?:отзывы|комментарии|похожие\s+рецепты|читайте\s+также|смотрите\s+также|рекомендуем|оцените\s+рецепт|поделиться|подписаться|реклама|вам\s+может\s+понравиться|другие\s+рецепты)(?:\s|:|$)/i;

        function parseDuration(str) {
            const h = str.match(/(\d+(?:[.,]\d+)?)\s*(?:час[а-яё]*|ч(?![а-яё]))/i);
            const mi = str.match(/(\d+)\s*мин[а-яё]*/i);
            if (!h && !mi) return null;
            let total = 0;
            if (h) total += Math.round(parseFloat(h[1].replace(',', '.')) * 60);
            if (mi) total += parseInt(mi[1], 10);
            if (total <= 0) return null;
            if (total >= 60) {
                const hh = Math.floor(total / 60), mm = total % 60;
                return mm ? `${hh} ч ${mm} мин` : `${hh} ч`;
            }
            return `${total} мин`;
        }

        const stemHas = (text, stems) => stems.some(s => new RegExp('(?:^|[^а-яёa-z])' + s, 'i').test(text));

        const CATEGORY_RULES = [
            ['Дополнительно', ['напит', 'коктейл', 'смузи', 'лимонад', 'морс', 'компот', 'кисель', 'глинтвейн', 'какао', 'латте', 'капучино', 'кофе', 'чай(?![а-яё])']],
            ['Десерты', ['десерт', 'торт', 'пирожн', 'мороженое', 'чизкейк', 'тирамису', 'мусс', 'пудинг', 'желе', 'брауни', 'суфле', 'панна\\s?котта', 'эклер', 'шоколадн', 'конфет']],
            ['Выпечка', ['пирог', 'пирожк', 'выпечк', 'хлеб', 'булк', 'печень', 'кекс', 'маффин', 'пицц', 'лепешк', 'пончик', 'круассан', 'шарлотк', 'бисквит', 'хачапури', 'булочк']],
            ['Завтраки', ['завтрак', 'омлет', 'яичниц', 'сырник', 'каш', 'оладь', 'блин', 'гранол', 'тост', 'глазунь', 'скрэмбл', 'вафл']],
            ['Супы', ['суп(?!ер)', 'борщ', 'щи(?![а-яё])', 'солянк', 'бульон', 'уха(?![а-яё])', 'харчо', 'рассольник', 'гаспачо', 'окрошк']],
            ['Салаты', ['салат', 'винегрет', 'оливье']],
            ['Закуски', ['закуск', 'бутерброд', 'канап', 'тапас', 'брускетт', 'намазк', 'паштет', 'хумус', 'тарталетк', 'нарезк']]
        ];

        const MEAT = ['мяс', 'говяд', 'свин', 'куриц', 'курин', 'индейк', 'бекон', 'колбас', 'ветчин', 'фарш', 'стейк', 'баран', 'телятин', 'ребр', 'котлет'];
        const POULTRY = ['куриц', 'курин', 'индейк', 'птиц', 'цыпл', 'утк'];
        const FISH = ['рыб', 'лосос', 'семг', 'форел', 'треск', 'тунец', 'креветк', 'кальмар', 'мидии', 'морепрод', 'краб', 'осьминог'];

        function detectCategory(title, desc, ingText) {
            const t = title.toLowerCase();
            const d = (title + ' ' + desc).toLowerCase();
            let category = null;
            for (const text of [t, d]) {
                for (const [cat, stems] of CATEGORY_RULES) {
                    if (stemHas(text, stems)) { category = cat; break; }
                }
                if (category) break;
            }
            if (!category) category = 'Горячее';

            const all = (d + ' ' + ingText).toLowerCase();
            let subcategory = 'Все';
            if (category === 'Супы') {
                subcategory = stemHas(t, FISH) ? 'Рыбные' : stemHas(t, MEAT.concat(POULTRY)) ? 'Мясные'
                    : stemHas(all, FISH) ? 'Рыбные' : stemHas(all, MEAT.concat(POULTRY)) ? 'Мясные' : 'Овощные';
            } else if (category === 'Салаты') {
                subcategory = stemHas(t, FISH) ? 'С морепродуктами' : stemHas(t, MEAT.concat(POULTRY)) ? 'Мясные'
                    : stemHas(all, FISH) ? 'С морепродуктами' : stemHas(all, MEAT.concat(POULTRY)) ? 'Мясные' : 'Овощные';
            } else if (category === 'Горячее') {
                const pick = (text) => {
                    if (stemHas(text, POULTRY)) return 'Курица';
                    if (stemHas(text, FISH)) return 'Рыба и морепродукты';
                    if (stemHas(text, MEAT)) return 'Мясо';
                    if (stemHas(text, ['рис(?![а-яё])', 'греч', 'пшен', 'булгур', 'кускус', 'перловк', 'ячнев', 'овсян', 'киноа', 'пшено', 'ризотто', 'плов'])) return 'Крупы';
                    if (stemHas(text, ['овощ', 'кабачк', 'баклажан', 'капуст', 'тыкв', 'гриб', 'рагу', 'картофел', 'цветн'])) return 'Овощи';
                    return null;
                };
                subcategory = pick(t) || pick(all) || 'Все';
            }
            return { category, subcategory };
        }

        const looksLikeStep = (line) =>
            ((/^(?:шаг\s*\d+|\d+[.)])\s+\S/i.test(line) && line.length >= 45) || line.length >= 90);

        function parseRecipeText(rawText) {
            const lines = rawText
                .replace(/\r/g, '')
                .split('\n')
                .map(l => l.replace(/ /g, ' ').trim())
                .filter(Boolean);

            let title = '';
            let section = 'meta';
            let prepTime = null, servings = null, difficulty = null;
            const ingredients = [];
            const steps = [];
            const loose = [];
            const metaLines = [];
            let sawStructure = false; // встретились заголовки разделов / «Шаг N» / «Порций: N»
            const cleanTitle = (l) => l.replace(/^[#*_>\s]+/, '').replace(/[*_]+$/g, '').replace(/^рецепт\s*[:\-–—]\s*/i, '').replace(/[:.]+$/, '').trim().slice(0, 150);

            const stripStepPrefix = (l) => l.replace(/^(?:шаг\s*\d+\s*[:.)-]?\s*|\d+\s*[.)]\s*|[-*•–—▪●]\s*)/i, '').trim();

            for (const line of lines) {
                if (section === 'end') break;
                const bare = line.replace(/^[#*_>\s-]+/, '').replace(/[*_]+$/, '');
                if (section !== 'meta' && RE_STOP_LINE.test(bare) && bare.length < 60) { section = 'end'; continue; }
                // «Шаг 1» отдельной строкой — только номер, текст на следующей строке
                if (/^шаг\s*\d+\s*[:.]?$/i.test(bare)) { sawStructure = true; if (section === 'ingredients' || section === 'meta') section = 'steps'; continue; }

                const hdr = headerInfo(line);
                if (hdr) {
                    sawStructure = true;
                    section = hdr.type;
                    if (hdr.servings) servings = hdr.servings;
                    continue;
                }

                // «Ингредиенты: тыква 800 г; лук 1 шт» (содержимое в той же строке)
                const inline = line.match(/^[#*_\s]*(ингредиент[а-яё]*|состав|продукты|приготовление|способ приготовления)\s*:\s*(.{3,})$/i);
                if (inline) {
                    const isIng = /^(ингредиент|состав|продукты)/i.test(inline[1]);
                    section = isIng ? 'ingredients' : 'steps';
                    inline[2].split(/;|\s{2,}/).map(s => s.trim()).filter(Boolean).forEach(part => {
                        if (isIng) {
                            const ing = parseIngredient(part); delete ing._unparsed; ingredients.push(ing);
                        } else steps.push(stripStepPrefix(part));
                    });
                    continue;
                }

                // Метаданные вида «Время: 40 мин», «Порций: 4», «Сложность: легко»
                const kv = line.match(/^[#*_\s-]*(время(?:\s+приготовления)?|время\s+готовки|порци[ий][а-яё]*|количество\s+порций|кол-во\s+порций|выход|сложность|на\s+сколько\s+человек)\s*[:\-–—]\s*(.+)$/i);
                if (kv) {
                    sawStructure = true;
                    const key = kv[1].toLowerCase(), val = kv[2];
                    if (/^время/.test(key)) { prepTime = parseDuration(val) || prepTime; }
                    else if (/^сложн/.test(key)) {
                        const v = val.toLowerCase();
                        difficulty = /легк|прост|лёгк/.test(v) ? 'Легко' : /сложн|тяжел|трудн/.test(v) ? 'Сложно' : /сред/.test(v) ? 'Средне' : difficulty;
                    } else {
                        const n = val.match(/\d+/);
                        if (n) servings = parseInt(n[0], 10);
                    }
                    continue;
                }

                if (section === 'meta') {
                    metaLines.push(line);
                } else if (section === 'ingredients') {
                    if (looksLikeStep(line) && parseIngredient(line)._unparsed) {
                        section = 'steps';
                        steps.push(stripStepPrefix(line));
                        continue;
                    }
                    // Подзаголовки типа «Для соуса:» — пропускаем как заголовок группы
                    if (/^(?:для\s+.+|.+):$/i.test(line) && line.length < 40) continue;
                    const ing = parseIngredient(line);
                    delete ing._unparsed;
                    if (ing.name) ingredients.push(ing);
                } else {
                    const s = stripStepPrefix(line);
                    if (s) steps.push(s);
                }
            }

            // Название: обычно первая строка. Но если текст скопирован со страницы целиком
            // (сначала меню сайта из коротких слов), берём последнюю «настоящую» строку перед рецептом.
            if (metaLines.length) {
                let ti = 0;
                const isWordy = (l) => l.trim().split(/\s+/).length >= 2 && l.length >= 12 && l.length <= 150 && !/^(?:\d+[.)]|[-*•–—▪●])/.test(l.trim()) && !/[.!]$/.test(l.trim());
                if (sawStructure && metaLines.length >= 4 && metaLines[0].trim().split(/\s+/).length === 1 && metaLines[0].length <= 14) {
                    for (let i = metaLines.length - 1; i >= 0; i--) { if (isWordy(metaLines[i])) { ti = i; break; } }
                }
                title = cleanTitle(metaLines[ti]);
                loose.push(...metaLines.slice(ti + 1));
            }

            // Текст без заголовков: пробуем разложить «на глаз»
            let description = '';
            if (ingredients.length === 0 && steps.length === 0 && loose.length) {
                const leftovers = [];
                for (const l of loose) {
                    const numbered = /^(?:шаг\s*\d+|\d+[.)])\s+\S/i.test(l);
                    const ing = parseIngredient(l);
                    const looksIng = !ing._unparsed && l.length < 70;
                    if (numbered && l.length >= 25) steps.push(stripStepPrefix(l));
                    else if (looksIng && !numbered) { delete ing._unparsed; ingredients.push(ing); }
                    else if (l.length >= 50 || /[.!]$/.test(l)) steps.push(stripStepPrefix(l));
                    else leftovers.push(l);
                }
                description = leftovers[0] || '';
            } else if (loose.length) {
                description = loose[0];
            }
            if (description.length > 220) description = description.slice(0, 217).trimEnd() + '…';

            const realFound = { ing: ingredients.length > 0, steps: steps.length > 0 };
            if (!title) title = 'Новое блюдо';
            if (!description) description = 'Домашний рецепт.';
            if (ingredients.length === 0) ingredients.push({ name: 'Основной продукт', amount: '500', unit: 'г' }, { name: 'Специи', amount: 'по вкусу', unit: '' });
            if (steps.length === 0) steps.push('Подготовьте все необходимые ингредиенты.', 'Смешайте компоненты и готовьте до готовности.');

            const { category, subcategory } = detectCategory(title, description, ingredients.map(i => i.name).join(' '));
            const base = Math.min(100, Math.max(1, servings || 4));

            return {
                id: 'gen_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                _real: realFound,
                title,
                category,
                subcategory,
                prepTime: prepTime || '30 мин',
                difficulty: difficulty || 'Средне',
                baseServingsCount: base,
                servings: pluralPortions(base),
                description,
                ingredients,
                steps
            };
        }

        /* =====================================================================
           Импорт рецепта по ссылке
           ===================================================================== */
        const isUrl = (s) => /^https?:\/\/\S+$/i.test(String(s || '').trim());

        // Безопасно превращаем HTML-фрагмент в обычный текст (без выполнения скриптов)
        const htmlToPlain = (v) => {
            const doc = new DOMParser().parseFromString(String(v ?? ''), 'text/html');
            return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        };

        // Если у вас есть свой мини-прокси (например, Cloudflare Worker, см. подсказку в ответе Claude),
        // впишите его адрес сюда: https://ваш-воркер.workers.dev/?url=
        const IMPORT_PROXY = '';

        const withTimeout = async (url, ms = 12000) => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res;
            } finally {
                clearTimeout(timer);
            }
        };

        async function fetchPageHtml(url) {
            const enc = encodeURIComponent(url);
            const attempts = [
                async () => (await withTimeout(url)).text(),
                async () => (await withTimeout('https://api.allorigins.win/raw?url=' + enc)).text(),
                async () => { const j = await (await withTimeout('https://api.allorigins.win/get?url=' + enc)).json(); return j.contents; },
                async () => (await withTimeout('https://api.codetabs.com/v1/proxy/?quest=' + enc)).text(),
                async () => (await withTimeout('https://corsproxy.io/?' + enc)).text()
            ];
            if (IMPORT_PROXY) attempts.unshift(async () => (await withTimeout(IMPORT_PROXY + enc)).text());
            // Пробуем все способы одновременно, берём первый, который вернул настоящую страницу
            return await Promise.any(attempts.map(fn => fn().then(t => {
                if (typeof t !== 'string' || t.length < 300 || !/<(html|body|head|div|script)/i.test(t)) throw new Error('empty');
                return t;
            })));
        }

        // Запасной способ: «читалка» отдаёт текст страницы без вёрстки
        async function fetchViaReader(url) {
            const raw = await (await withTimeout('https://r.jina.ai/' + url, 20000)).text();
            if (!raw || raw.length < 200) throw new Error('empty');
            let text = raw
                .replace(/^(?:Title|URL Source|Published Time|Markdown Content|Warning):.*$/gim, m => /^Title:/i.test(m) ? m.replace(/^Title:\s*/i, '') : '')
                .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/^\s*[*_]{1,3}|[*_]{1,3}\s*$/gm, '');
            return text.split('\n').map(l => l.trim()).filter(Boolean).join('\n');
        }

        function findRecipeJsonLd(doc) {
            const found = [];
            const visit = (n) => {
                if (!n || typeof n !== 'object') return;
                if (Array.isArray(n)) { n.forEach(visit); return; }
                const t = n['@type'];
                if ((Array.isArray(t) ? t : [t]).some(x => /(^|\/)Recipe$/i.test(String(x)))) found.push(n);
                if (n['@graph']) visit(n['@graph']);
            };
            doc.querySelectorAll('script[type="application/ld+json"]').forEach(sc => {
                try { visit(JSON.parse(sc.textContent)); } catch (e) { /* пропускаем битый блок */ }
            });
            return found[0] || null;
        }

        function isoToMinutes(iso) {
            const m = String(iso || '').match(/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
            if (!m) return 0;
            return (parseInt(m[1] || 0, 10) * 1440) + (parseInt(m[2] || 0, 10) * 60) + parseInt(m[3] || 0, 10);
        }

        function flattenInstructions(v) {
            if (!v) return [];
            if (typeof v === 'string') return htmlToPlain(v.replace(/<\/(p|li|div|br)>|<br\s*\/?>/gi, '$&\n')).length
                ? v.replace(/<\/(p|li|div)>|<br\s*\/?>/gi, '\n').split('\n').map(htmlToPlain).filter(Boolean) : [];
            if (Array.isArray(v)) return v.flatMap(flattenInstructions);
            if (typeof v === 'object') {
                if (v.itemListElement) return flattenInstructions(v.itemListElement);
                const t = v.text || v.name;
                return t ? flattenInstructions(String(t)) : [];
            }
            return [];
        }

        function recipeFromJsonLd(ld, doc) {
            const first = (v) => Array.isArray(v) ? v[0] : v;
            const name = htmlToPlain(ld.name || '');
            const desc = htmlToPlain(ld.description || '').slice(0, 220);
            const ings = (Array.isArray(ld.recipeIngredient) ? ld.recipeIngredient : (ld.recipeIngredient ? [ld.recipeIngredient] : []))
                .map(htmlToPlain).filter(Boolean);
            const steps = flattenInstructions(ld.recipeInstructions);
            let mins = isoToMinutes(ld.totalTime) || (isoToMinutes(ld.prepTime) + isoToMinutes(ld.cookTime));
            const yieldMatch = String(Array.isArray(ld.recipeYield) ? ld.recipeYield.join(' ') : (ld.recipeYield || '')).match(/\d+/);
            let img = first(ld.image);
            if (img && typeof img === 'object') img = img.url || img.contentUrl || '';
            if (!img) { const og = doc.querySelector('meta[property="og:image"]'); img = og ? og.getAttribute('content') : ''; }

            const lines = [name || 'Новое блюдо'];
            if (desc) lines.push(desc);
            if (mins) lines.push('Время: ' + mins + ' минут');
            if (yieldMatch) lines.push('Порций: ' + yieldMatch[0]);
            lines.push('Ингредиенты', ...ings, 'Приготовление', ...steps);
            return { text: lines.join('\n'), image: typeof img === 'string' ? img : '', structured: ings.length > 0 && steps.length > 0 };
        }

        function recipeFromPageText(doc) {
            ['script', 'style', 'noscript', 'svg', 'nav', 'header', 'footer', 'form', 'iframe'].forEach(t => doc.querySelectorAll(t).forEach(e => e.remove()));
            const og = doc.querySelector('meta[property="og:title"]');
            const h1 = doc.querySelector('h1');
            const title = htmlToPlain((og && og.getAttribute('content')) || (h1 && h1.textContent) || doc.title || '');
            const ogImg = doc.querySelector('meta[property="og:image"]');

            // Микроразметка itemprop
            const micro = (sel) => [...doc.querySelectorAll(sel)].map(e => e.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean);
            const mIng = micro('[itemprop="recipeIngredient"], [itemprop="ingredients"]');
            let mSteps = micro('[itemprop="recipeInstructions"] li, [itemprop="recipeInstructions"] p, [itemprop="recipeInstructions"] [itemprop="text"]');
            if (!mSteps.length) mSteps = micro('[itemprop="recipeInstructions"]');
            if (mIng.length && mSteps.length) {
                return { text: [title || 'Новое блюдо', 'Ингредиенты', ...mIng, 'Приготовление', ...mSteps].join('\n'), image: ogImg ? ogImg.getAttribute('content') : '', structured: true };
            }

            // Обычный текст страницы
            const root = doc.querySelector('article, main, [role="main"]') || doc.body;
            root.querySelectorAll('br, p, li, div, h1, h2, h3, h4, h5, h6, tr, section').forEach(e => e.append('\n'));
            const text = (root.textContent || '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n');
            return { text: (title ? title + '\n' : '') + text, image: ogImg ? ogImg.getAttribute('content') : '', structured: false };
        }

        const textLooksLikeRecipe = (text) => {
            try { const r = parseRecipeText(text); return r._real.ing && r._real.steps; } catch (e) { return false; }
        };

        async function importFromUrl(url) {
            let best = null;
            try {
                const html = await fetchPageHtml(url);
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const ld = findRecipeJsonLd(doc);
                if (ld) {
                    const r = recipeFromJsonLd(ld, doc);
                    if (r.structured) return r;
                }
                best = recipeFromPageText(doc);
                if (best.structured || textLooksLikeRecipe(best.text)) return best;
            } catch (e) { /* пробуем запасной способ */ }

            try {
                const text = await fetchViaReader(url);
                const alt = { text, image: (best && best.image) || '', structured: false };
                if (textLooksLikeRecipe(alt.text) || !best) return alt;
            } catch (e) { /* ignore */ }

            if (best) return best;
            throw new Error('Страница недоступна');
        }

        /* =====================================================================
           Чтение файлов (txt / md / docx / pdf)
           ===================================================================== */
        const _scriptCache = {};
        function loadScript(src) {
            if (!_scriptCache[src]) {
                _scriptCache[src] = new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.onload = resolve;
                    s.onerror = () => { delete _scriptCache[src]; reject(new Error('Не удалось загрузить библиотеку')); };
                    document.head.appendChild(s);
                });
            }
            return _scriptCache[src];
        }

        async function extractTextFromFile(file) {
            const name = file.name.toLowerCase();

            if (name.endsWith('.docx')) {
                await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
                const res = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
                return res.value;
            }

            if (name.endsWith('.pdf')) {
                await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
                const pdfjs = window.pdfjsLib;
                pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
                const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
                let out = '';
                for (let p = 1; p <= pdf.numPages; p++) {
                    const content = await (await pdf.getPage(p)).getTextContent();
                    let lastY = null;
                    for (const item of content.items) {
                        const y = item.transform ? Math.round(item.transform[5]) : null;
                        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) out += '\n';
                        out += item.str;
                        if (item.hasEOL) out += '\n';
                        lastY = y;
                    }
                    out += '\n';
                }
                return out;
            }

            if (name.endsWith('.doc')) {
                throw new Error('Старый формат .doc не читается. Сохраните файл как .docx или вставьте текст вручную.');
            }

            return await file.text();
        }

        /* =====================================================================
           Приложение
           ===================================================================== */
        class RecipeApp {
            constructor() {
                // Отдельная страница одного рецепта (скачанный файл): без каталога вообще
                this.standalone = !!window.__STANDALONE_RECIPE__;
                this.recipes = this.standalone ? [] : this.loadRecipes();
                this.favorites = this.standalone ? [] : this.loadFavorites();
                this.selectedCategory = 'Все';
                this.selectedSubcategory = 'Все';
                this.searchQuery = '';
                this.selectedRecipeId = null;
                this.isolatedRecipe = null;
                this.currentServings = null;
                this.checkedIngredients = {};

                // Режим персональной ссылки: после входа по #view= каталог недоступен до перезагрузки без хэша
                this.locked = false;
                this.lockedUrl = '';
                this.cook = null;
                this.editDraft = null;
                this.cookInterval = null;
                this.audioCtx = null;
                this.wakeLock = null;

                document.addEventListener('keydown', (e) => this.handleKey(e));

                if (this.standalone) {
                    this.locked = true;
                    this.isolatedRecipe = sanitizeRecipe(window.__STANDALONE_RECIPE__);
                    this.currentServings = this.isolatedRecipe ? this.isolatedRecipe.baseServingsCount : null;
                    this.render();
                    return;
                }

                this.initFromUrlHash();
                window.addEventListener('hashchange', () => this.initFromUrlHash());
            }

            handleKey(e) {
                const tag = (e.target && e.target.tagName) || '';
                if (this.cook) {
                    if (e.key === 'Escape') this.closeCook();
                    else if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                        if (e.key === 'ArrowRight') this.cookNext();
                        else if (e.key === 'ArrowLeft') this.cookPrev();
                    }
                    return;
                }
                if (e.key === 'Escape') this.closeModal();
            }

            /* ---------- хранилище ---------- */
            loadRecipes() {
                try {
                    const saved = localStorage.getItem('julia_recipes_db');
                    const parsed = saved ? JSON.parse(saved) : null;
                    if (!Array.isArray(parsed)) return DEFAULT_RECIPES;
                    // Рубрика «Напитки» удалена — такие рецепты переезжают в «Дополнительно»
                    let migrated = false;
                    parsed.forEach(r => { if (r && r.category === 'Напитки') { r.category = 'Дополнительно'; r.subcategory = 'Все'; migrated = true; } });
                    if (migrated) { try { localStorage.setItem('julia_recipes_db', JSON.stringify(parsed)); } catch (e) { /* ignore */ } }
                    return parsed;
                } catch (e) {
                    return DEFAULT_RECIPES;
                }
            }

            saveRecipes() {
                try { localStorage.setItem('julia_recipes_db', JSON.stringify(this.recipes)); } catch (e) { this.showToast('Не удалось сохранить рецепты в браузере', 'error'); }
            }

            loadFavorites() {
                try {
                    const saved = localStorage.getItem('julia_recipes_favs');
                    const parsed = saved ? JSON.parse(saved) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            }

            saveFavorites() {
                try { localStorage.setItem('julia_recipes_favs', JSON.stringify(this.favorites)); } catch (e) { /* ignore */ }
            }

            showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs font-semibold flex items-center space-x-2 transition transform translate-y-2 opacity-0 ${
                    type === 'success' ? 'bg-violet-900 text-white' : 'bg-slate-900 text-white'
                }`;
                const icon = type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-check text-violet-400';
                toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${esc(message)}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            imgFallback(img) {
                img.onerror = null;
                img.src = FALLBACK_IMG;
            }

            /* ---------- навигация по хэшу ---------- */
            loadShared(payload) {
                this.isolatedRecipe = null;
                try {
                    const imported = sanitizeRecipe(decodeShare(payload));
                    if (imported) {
                        this.isolatedRecipe = imported;
                        this.currentServings = imported.baseServingsCount;
                        this.checkedIngredients = {};
                        document.title = imported.title + " — Julia's Recipes";
                    }
                } catch (e) {
                    console.error('View error', e);
                }
                this.selectedRecipeId = null;
            }

            initFromUrlHash() {
                const hash = window.location.hash;
                const queryPayload = new URLSearchParams(window.location.search).get('view');
                const payload = hash.startsWith('#view=') ? hash.slice('#view='.length) : queryPayload;

                if (payload) {
                    const cur = window.location.pathname + window.location.search + window.location.hash;
                    if (this.locked && this.lockedUrl && !hash.startsWith('#view=') && cur !== this.lockedUrl) {
                        history.replaceState(null, '', this.lockedUrl); // чужой хэш поверх ?view= — возвращаем адрес
                    } else {
                        this.lockedUrl = cur;
                    }
                    this.locked = true;
                    this.loadShared(payload);
                } else if (this.locked) {
                    // В режиме персональной ссылки любая попытка сменить адрес возвращается обратно
                    const cur = window.location.pathname + window.location.search + window.location.hash;
                    if (this.lockedUrl && cur !== this.lockedUrl) {
                        history.replaceState(null, '', this.lockedUrl);
                    }
                } else if (hash.startsWith('#recipe=')) {
                    const id = decodeURIComponent(hash.slice('#recipe='.length));
                    const recipe = this.recipes.find(r => r.id === id);
                    if (recipe) {
                        if (this.selectedRecipeId !== id) {
                            this.currentServings = recipe.baseServingsCount || 4;
                            this.checkedIngredients = {};
                        }
                        this.selectedRecipeId = id;
                    } else {
                        this.selectedRecipeId = null;
                    }
                } else {
                    // Пустой хэш (в том числе кнопка «Назад» в браузере) = каталог
                    this.selectedRecipeId = null;
                }
                this.render();
            }

            resetView() {
                if (this.locked) return;
                this.selectedRecipeId = null;
                if (window.location.hash) {
                    window.location.hash = ''; // сработает hashchange → render
                } else {
                    this.render();
                }
            }

            openRecipe(id) {
                if (this.locked) return;
                const recipe = this.recipes.find(r => r.id === id);
                if (!recipe) return;
                this.selectedRecipeId = id;
                this.currentServings = recipe.baseServingsCount || 4;
                this.checkedIngredients = {};
                window.location.hash = '#recipe=' + encodeURIComponent(id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            toggleFavorite(id, e) {
                if (e) e.stopPropagation();
                if (this.locked) return;
                if (this.favorites.includes(id)) {
                    this.favorites = this.favorites.filter(f => f !== id);
                    this.showToast('Удалено из избранного', 'info');
                } else {
                    this.favorites.push(id);
                    this.showToast('Добавлено в избранное', 'success');
                }
                this.saveFavorites();
                this.render();
            }

            deleteRecipe(id, e) {
                if (e) e.stopPropagation();
                if (this.locked) return;
                if (!confirm('Вы уверены, что хотите удалить этот рецепт?')) return;
                this.recipes = this.recipes.filter(r => r.id !== id);
                this.favorites = this.favorites.filter(f => f !== id);
                this.saveRecipes();
                this.saveFavorites();
                this.showToast('Рецепт успешно удален', 'success');
                this.resetView();
            }

            /* ---------- поделиться ---------- */
            async copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        const ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        return ok;
                    } catch (e2) {
                        return false;
                    }
                }
            }

            async generateShareLink(id) {
                const recipe = this.isolatedRecipe && this.locked
                    ? this.isolatedRecipe
                    : this.recipes.find(r => r.id === id);
                if (!recipe) return;
                try {
                    const payload = {
                        title: recipe.title,
                        category: recipe.category,
                        subcategory: recipe.subcategory,
                        prepTime: recipe.prepTime,
                        difficulty: recipe.difficulty,
                        baseServingsCount: recipe.baseServingsCount,
                        description: recipe.description,
                        image: recipe.image,
                        ingredients: recipe.ingredients,
                        steps: recipe.steps
                    };
                    const enc = encodeShare(payload);
                    const base = window.location.href.split('#')[0].split('?')[0];
                    // Данные дублируются в ?query и #hash: если хостинг теряет одно из них, сработает другое
                    const url = base + '?view=' + enc + '#view=' + enc;
                    const ok = await this.copyText(url);
                    if (ok) this.showToast('Персональная ссылка скопирована!');
                    else {
                        window.prompt('Скопируйте ссылку вручную:', url);
                    }
                } catch (e) {
                    this.showToast('Не удалось создать ссылку', 'error');
                }
            }

            downloadStandalone(id) {
                if (this.locked) return;
                const recipe = this.recipes.find(r => r.id === id);
                if (!recipe) return;
                try {
                    const data = {
                        title: recipe.title, category: recipe.category, subcategory: recipe.subcategory,
                        prepTime: recipe.prepTime, difficulty: recipe.difficulty, baseServingsCount: recipe.baseServingsCount,
                        description: recipe.description, image: recipe.image, ingredients: recipe.ingredients, steps: recipe.steps
                    };
                    const clone = document.documentElement.cloneNode(true);
                    ['app', 'headerActions', 'modalContainer', 'cookContainer', 'toastContainer'].forEach(i => {
                        const el = clone.querySelector('#' + i);
                        if (el) el.innerHTML = '';
                    });
                    const t = clone.querySelector('title');
                    if (t) t.textContent = recipe.title + " — Julia's Recipes";
                    const inject = document.createElement('script');
                    inject.textContent = 'window.__STANDALONE_RECIPE__ = ' + JSON.stringify(data).replace(/</g, '\\u003c') + ';';
                    clone.querySelector('head').insertBefore(inject, clone.querySelector('head').firstChild);
                    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
                    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'recipe-' + (recipe.id || 'dish') + '.html';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                    this.showToast('Страница рецепта скачана — её можно выложить на любой хостинг');
                } catch (e) {
                    this.showToast('Не удалось создать файл', 'error');
                }
            }

            /* ---------- добавление рецепта ---------- */
            parseRecipeFromRawText(rawText) {
                return parseRecipeText(rawText);
            }

            openGeneratorModal() {
                if (this.locked) return;
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div id="modalOverlay" onclick="if (event.target === this) window.app.closeModal()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fadeIn">
                        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative border border-slate-100 space-y-6 max-h-[90vh] overflow-y-auto">
                            <div class="flex items-center justify-between">
                                <h3 class="text-base font-bold text-slate-900">Новый рецепт</h3>
                                <button onclick="window.app.closeModal()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Текст / Ингредиенты и шаги</label>
                                    <textarea id="recipeTextInput" rows="6" placeholder="Первая строка — название. Дальше «Ингредиенты» и «Приготовление» (можно и без заголовков)..." class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-none focus:border-violet-600 transition resize-none"></textarea>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Или ссылка на страницу с рецептом</label>
                                    <input type="text" id="recipeLinkInput" placeholder="https://site.ru/recipe/123" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-none focus:border-violet-600 transition">
                                    <p id="recipeLinkStatus" class="text-[11px] text-slate-500 mt-2 hidden"></p>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Ссылка на фото (URL)</label>
                                    <input type="text" id="recipeImageUrlInput" placeholder="https://example.com/photo.jpg" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-none focus:border-violet-600 transition">
                                </div>

                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Загрузить файл рецепта (.txt, .docx, .pdf)</label>
                                    <input type="file" id="recipeFileInput" accept=".txt,.md,.docx,.pdf" onchange="window.app.handleFileSelected(this)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100 transition">
                                    <p id="recipeFileStatus" class="text-[11px] text-slate-500 mt-2 hidden"></p>
                                </div>
                            </div>

                            <button id="recipeSubmitBtn" onclick="window.app.finalizeNewRecipe()" class="w-full py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold text-sm shadow-sm transition active:scale-95 flex items-center justify-center space-x-2">
                                <span>Добавить рецепт</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            async handleFileSelected(input) {
                const file = input.files && input.files[0];
                const status = document.getElementById('recipeFileStatus');
                const textArea = document.getElementById('recipeTextInput');
                if (!file || !status || !textArea) return;

                const setStatus = (msg, isError) => {
                    status.textContent = msg;
                    status.classList.remove('hidden', 'text-rose-600', 'text-slate-500');
                    status.classList.add(isError ? 'text-rose-600' : 'text-slate-500');
                };

                setStatus('Читаю файл…');
                try {
                    const text = (await extractTextFromFile(file)).trim();
                    if (!text) throw new Error('В файле не найден текст (возможно, это скан). Вставьте текст вручную.');
                    textArea.value = text; // пользователь видит и может поправить распознанный текст
                    setStatus(`Файл «${file.name}» прочитан — проверьте текст и нажмите «Добавить рецепт»`);
                } catch (e) {
                    input.value = '';
                    setStatus(e.message || 'Не удалось прочитать файл', true);
                }
            }

            async finalizeNewRecipe() {
                if (this.locked) return;
                const textInput = document.getElementById('recipeTextInput');
                const imageUrlInput = document.getElementById('recipeImageUrlInput');
                const linkInput = document.getElementById('recipeLinkInput');
                const linkStatus = document.getElementById('recipeLinkStatus');
                const btn = document.getElementById('recipeSubmitBtn');

                let rawText = textInput ? textInput.value.trim() : '';
                const linkValue = linkInput ? linkInput.value.trim() : '';
                // Ссылка может быть вставлена и в большое текстовое поле
                const url = isUrl(rawText) ? rawText : (!rawText && linkValue ? linkValue : '');

                let importedImage = '';
                let structured = true;

                if (url) {
                    if (!isUrl(url)) {
                        this.showToast('Ссылка должна начинаться с http:// или https://', 'error');
                        return;
                    }
                    const setLinkStatus = (msg, isError) => {
                        if (!linkStatus) return;
                        linkStatus.textContent = msg;
                        linkStatus.classList.remove('hidden', 'text-rose-600', 'text-slate-500');
                        linkStatus.classList.add(isError ? 'text-rose-600' : 'text-slate-500');
                    };
                    const label = btn ? btn.querySelector('span') : null;
                    if (btn) btn.classList.add('pointer-events-none', 'opacity-70');
                    if (label) label.textContent = 'Загружаю рецепт…';
                    setLinkStatus('Читаю страницу…');
                    try {
                        const imported = await importFromUrl(url);
                        rawText = imported.text;
                        importedImage = imported.image || '';
                        structured = imported.structured;
                    } catch (e) {
                        setLinkStatus('Не удалось открыть страницу. Если рецепт в личном кабинете или за входом, откройте его, выделите весь текст рецепта и вставьте в поле выше.', true);
                        this.showToast('Не удалось получить рецепт по ссылке', 'error');
                        if (btn) btn.classList.remove('pointer-events-none', 'opacity-70');
                        if (label) label.textContent = 'Добавить рецепт';
                        return;
                    }
                    if (btn) btn.classList.remove('pointer-events-none', 'opacity-70');
                    if (label) label.textContent = 'Добавить рецепт';
                }

                if (!rawText) {
                    this.showToast('Введите текст рецепта, вставьте ссылку или загрузите файл', 'error');
                    return;
                }

                const newRecipe = this.parseRecipeFromRawText(rawText);
                const real = newRecipe._real;
                delete newRecipe._real;

                if (url && !structured && !(real.ing && real.steps)) {
                    if (linkStatus) {
                        linkStatus.textContent = 'На странице не нашлось рецепта (ингредиентов и шагов). Скорее всего она закрыта входом или рецепт подгружается скриптом: скопируйте текст рецепта и вставьте в поле выше.';
                        linkStatus.classList.remove('hidden', 'text-slate-500');
                        linkStatus.classList.add('text-rose-600');
                    }
                    this.showToast('Рецепт на странице не найден', 'error');
                    return;
                }

                const imgUrl = imageUrlInput ? imageUrlInput.value.trim() : '';
                newRecipe.image = /^https?:\/\/\S+$/i.test(imgUrl) ? imgUrl
                    : (/^https?:\/\/\S+$/i.test(importedImage) ? importedImage : FALLBACK_IMG);

                this.recipes.unshift(newRecipe);
                this.saveRecipes();
                this.closeModal();
                this.showToast('Рецепт успешно добавлен!');
                this.openRecipe(newRecipe.id);
            }

            closeModal() {
                const container = document.getElementById('modalContainer');
                if (container) container.innerHTML = '';
            }

            /* ---------- отрисовка ---------- */
            render() {
                const app = document.getElementById('app');
                const headerActions = document.getElementById('headerActions');
                const brand = document.getElementById('brand');
                if (!app) return;

                if (brand) {
                    brand.classList.toggle('cursor-pointer', !this.locked);
                    brand.classList.toggle('pointer-events-none', this.locked);
                }

                if (headerActions) {
                    headerActions.innerHTML = !this.locked ? `
                        <button onclick="window.app.openGeneratorModal()" class="px-5 py-2.5 rounded-full bg-violet-600 hover:bg-violet-700 text-white font-semibold text-xs sm:text-sm flex items-center space-x-2 shadow-sm transition active:scale-95">
                            <i class="fa-solid fa-plus text-xs"></i>
                            <span>Новый рецепт</span>
                        </button>
                    ` : '';
                }

                if (this.locked) {
                    this.closeModal();
                    document.title = this.isolatedRecipe ? this.isolatedRecipe.title + " — Julia's Recipes" : "Julia's Recipes";
                    app.innerHTML = this.isolatedRecipe
                        ? this.renderRecipeDetailHTML(this.isolatedRecipe, true)
                        : `
                            <div class="text-center py-24 space-y-3 animate-fadeIn">
                                <div class="w-16 h-16 rounded-3xl bg-lilac text-violet-600 flex items-center justify-center mx-auto text-2xl">
                                    <i class="fa-solid fa-link-slash"></i>
                                </div>
                                <h3 class="text-base font-bold text-slate-900">Ссылка повреждена</h3>
                                <p class="text-xs text-slate-500 max-w-sm mx-auto">Не удалось открыть рецепт. Попросите отправить ссылку ещё раз.</p>
                            </div>`;
                    return;
                }

                document.title = "Julia's Recipes";

                if (this.selectedRecipeId) {
                    const recipe = this.recipes.find(r => r.id === this.selectedRecipeId);
                    if (recipe) {
                        app.innerHTML = this.renderRecipeDetailHTML(recipe, false);
                        return;
                    }
                    this.selectedRecipeId = null;
                }

                if (this.cook) this.closeCook(true);

                // Запоминаем фокус в поиске, чтобы он не терялся при каждой букве
                const active = document.activeElement;
                const hadSearchFocus = active && active.id === 'searchInput';
                const caret = hadSearchFocus ? active.selectionStart : null;

                const categories = ['Избранное', 'Все', 'Грандшеф', ...CATEGORY_LIST];
                const subcategoriesMap = SUBCATEGORY_MAP;

                const q = this.searchQuery.toLowerCase();
                const filtered = this.recipes.filter(r => {
                    const matchesCategory = this.selectedCategory === 'Все'
                        || (this.selectedCategory === 'Избранное' ? this.favorites.includes(r.id)
                            : this.selectedCategory === 'Грандшеф' ? r.subcategory === 'Грандшеф'
                            : r.category === this.selectedCategory);
                    const matchesSubcategory = this.selectedSubcategory === 'Все' || r.subcategory === this.selectedSubcategory;
                    const matchesSearch = !q || r.title.toLowerCase().includes(q) || (r.ingredients || []).some(i => i.name.toLowerCase().includes(q));
                    return matchesCategory && matchesSubcategory && matchesSearch;
                });

                app.innerHTML = `
                    <div class="space-y-8 animate-fadeIn">
                        <!-- Search Bar -->
                        <div class="relative max-w-xl mx-auto">
                            <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input id="searchInput" type="text" value="${esc(this.searchQuery)}" oninput="window.app.handleSearch(this.value)" placeholder="Поиск по названию или ингредиентам..." class="w-full pl-12 pr-6 py-4 rounded-3xl bg-white border border-slate-200/80 shadow-sm text-sm text-slate-900 focus:outline-none focus:border-violet-600 transition">
                        </div>

                        <!-- Categories Filter -->
                        <div class="flex items-center space-x-3 overflow-x-auto pb-2 scrollbar-none">
                            ${categories.map(cat => {
                                const count = cat === 'Все' ? this.recipes.length
                                    : cat === 'Избранное' ? this.recipes.filter(r => this.favorites.includes(r.id)).length
                                    : cat === 'Грандшеф' ? this.recipes.filter(r => r.subcategory === 'Грандшеф').length
                                    : this.recipes.filter(r => r.category === cat).length;
                                const isSelected = this.selectedCategory === cat;
                                return `
                                    <button onclick="window.app.selectCategory('${cat}')" class="tab-btn ${isSelected ? 'is-active' : ''} px-6 py-3 rounded-full text-xs font-semibold whitespace-nowrap flex items-center space-x-2 bg-white border border-slate-200/80 ${
                                        isSelected ? 'text-slate-900' : 'text-slate-600'
                                    }">
                                        <span>${cat}</span>
                                        <span class="tab-count text-[12px] font-extrabold text-slate-400">${count}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- Subcategories if applicable -->
                        ${subcategoriesMap[this.selectedCategory] ? `
                            <div class="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-none">
                                ${subcategoriesMap[this.selectedCategory].map(sub => `
                                    <button onclick="window.app.selectSubcategory('${sub}')" class="px-4 py-2 rounded-2xl text-xs whitespace-nowrap bg-white border border-slate-200/80 ${
                                        this.selectedSubcategory === sub ? 'text-slate-900 font-bold' : 'text-slate-600 font-medium'
                                    }">
                                        ${sub}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}

                        <!-- Recipes Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${filtered.map(recipe => {
                                const isFav = this.favorites.includes(recipe.id);
                                return `
                                    <div onclick="window.app.openRecipe('${esc(recipe.id)}')" class="bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-md transition group cursor-pointer flex flex-col justify-between">
                                        <div>
                                            <div class="relative h-56 overflow-hidden bg-slate-100">
                                                <img src="${esc(safeUrl(recipe.image))}" alt="${esc(recipe.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="window.app.imgFallback(this)">
                                                <button onclick="window.app.toggleFavorite('${esc(recipe.id)}', event)" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-slate-700 hover:text-rose-600 transition shadow-sm">
                                                    <i class="${isFav ? 'fa-solid text-rose-600' : 'fa-regular'} fa-heart text-sm"></i>
                                                </button>
                                                <div class="absolute bottom-4 left-4 px-3 py-1.5 rounded-xl bg-white/90 backdrop-blur-md text-[11px] font-bold text-slate-800 shadow-sm">
                                                    ${esc(recipe.prepTime)}
                                                </div>
                                            </div>
                                            <div class="p-6 space-y-4">
                                                <div>
                                                    <div class="text-[11px] font-bold uppercase tracking-wider text-violet-600 mb-1">${esc(recipe.category)}</div>
                                                    <h3 class="text-base font-bold text-slate-900 group-hover:text-violet-600 transition line-clamp-1">${esc(recipe.title)}</h3>
                                                    <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${esc(recipe.description)}</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="px-6 pb-6 flex items-center justify-between pt-2 border-t border-slate-100">
                                            <span class="text-xs font-medium text-slate-500"><i class="fa-solid fa-user-group text-[10px] mr-1.5"></i>${esc(recipe.servings)}</span>
                                            <div class="flex items-center space-x-2">
                                                <button onclick="window.app.openEditModal('${esc(recipe.id)}', event)" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-violet-50 text-slate-400 hover:text-violet-700 flex items-center justify-center transition" title="Редактировать рецепт">
                                                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                                                </button>
                                                <button onclick="window.app.deleteRecipe('${esc(recipe.id)}', event)" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition" title="Удалить рецепт">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        ${filtered.length === 0 ? `
                            <div class="text-center py-16 space-y-3">
                                <div class="w-16 h-16 rounded-3xl bg-lilac text-violet-600 flex items-center justify-center mx-auto text-2xl">
                                    <i class="fa-solid fa-utensils"></i>
                                </div>
                                <h3 class="text-base font-bold text-slate-900">${this.searchQuery ? 'Рецепты не найдены' : this.selectedCategory === 'Избранное' ? 'В избранном пока пусто' : this.selectedCategory === 'Грандшеф' ? 'Здесь пока нет рецептов Грандшеф' : 'Рецепты не найдены'}</h3>
                                <p class="text-xs text-slate-500 max-w-sm mx-auto">${this.searchQuery ? 'Попробуйте изменить параметры поиска или добавить новый рецепт.' : this.selectedCategory === 'Избранное' ? 'Нажмите на сердечко у рецепта, и он появится здесь.' : this.selectedCategory === 'Грандшеф' ? 'Откройте рецепт, нажмите «Редактировать» и выберите подкатегорию «Грандшеф».' : 'Попробуйте изменить параметры поиска или добавить новый рецепт.'}</p>
                            </div>
                        ` : ''}
                    </div>
                `;

                if (hadSearchFocus) {
                    const input = document.getElementById('searchInput');
                    if (input) {
                        input.focus();
                        try { input.setSelectionRange(caret, caret); } catch (e) { /* ignore */ }
                    }
                }
            }

            renderRecipeDetailHTML(recipe, isIsolated) {
                const isFav = !isIsolated && this.favorites.includes(recipe.id);
                const base = recipe.baseServingsCount || 4;
                const current = this.currentServings || base;
                const multiplier = current / base;
                return `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn pb-16">
                        <!-- Top Bar -->
                        <div class="flex items-center justify-between">
                            ${!isIsolated ? `
                                <button onclick="window.app.resetView()" class="px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-xs flex items-center space-x-2 transition">
                                    <i class="fa-solid fa-arrow-left text-xs"></i>
                                    <span>Назад к рецептам</span>
                                </button>
                            ` : `
                                <div class="text-xs font-bold uppercase tracking-wider text-violet-600">Публичный рецепт</div>
                            `}
                            <div class="flex items-center space-x-3">
                                ${!this.standalone ? `
                                <button onclick="window.app.generateShareLink('${esc(recipe.id)}')" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 hover:bg-slate-50 transition shadow-sm" title="Поделиться">
                                    <i class="fa-solid fa-share-nodes text-xs"></i>
                                </button>` : ''}
                                ${!isIsolated ? `
                                <button onclick="window.app.openEditModal('${esc(recipe.id)}')" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 hover:bg-slate-50 transition shadow-sm" title="Редактировать рецепт">
                                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                                </button>
                                <button onclick="window.app.downloadStandalone('${esc(recipe.id)}')" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 hover:bg-slate-50 transition shadow-sm" title="Скачать отдельной страницей">
                                    <i class="fa-solid fa-file-arrow-down text-xs"></i>
                                </button>` : ''}
                                ${!isIsolated ? `
                                <button onclick="window.app.toggleFavorite('${esc(recipe.id)}')" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 hover:text-rose-600 transition shadow-sm" title="В избранное">
                                    <i class="${isFav ? 'fa-solid text-rose-600' : 'fa-regular'} fa-heart text-xs"></i>
                                </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Hero Banner -->
                        <div class="relative rounded-3xl overflow-hidden h-96 shadow-lg bg-slate-100">
                            <img src="${esc(safeUrl(recipe.image))}" alt="${esc(recipe.title)}" class="w-full h-full object-cover" onerror="window.app.imgFallback(this)">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/20 to-transparent flex flex-col justify-end p-8 text-white">
                                <div class="flex items-center space-x-3 mb-3">
                                    <span class="px-3 py-1 rounded-xl bg-violet-600 text-white text-[11px] font-bold uppercase tracking-wider">${esc(recipe.category)}</span>
                                    <span class="px-3 py-1 rounded-xl bg-white/20 backdrop-blur-md text-white text-[11px] font-semibold">${esc(recipe.prepTime)}</span>
                                    <span class="px-3 py-1 rounded-xl bg-white/20 backdrop-blur-md text-white text-[11px] font-semibold">${esc(recipe.difficulty)}</span>
                                </div>
                                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">${esc(recipe.title)}</h1>
                                <p class="text-slate-200 text-xs sm:text-sm mt-2 max-w-2xl leading-relaxed">${esc(recipe.description)}</p>
                            </div>
                        </div>

                        <!-- Content Layout -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- Ingredients Column -->
                            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm space-y-6 lg:col-span-1">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-base font-bold text-slate-900">Ингредиенты</h3>
                                    <div class="flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-2xl border border-slate-200">
                                        <button onclick="window.app.adjustServings(-1)" class="w-6 h-6 rounded-lg bg-white flex items-center justify-center text-slate-600 hover:bg-slate-100 font-bold text-xs shadow-sm">-</button>
                                        <span class="text-xs font-bold text-slate-800 whitespace-nowrap">${current} порц.</span>
                                        <button onclick="window.app.adjustServings(1)" class="w-6 h-6 rounded-lg bg-white flex items-center justify-center text-slate-600 hover:bg-slate-100 font-bold text-xs shadow-sm">+</button>
                                    </div>
                                </div>

                                <div class="space-y-3">
                                    ${recipe.ingredients.map((ing, idx) => {
                                        const calcAmount = scaleAmount(ing.amount, multiplier);
                                        const isChecked = this.checkedIngredients[idx];
                                        return `
                                            <div onclick="window.app.toggleIngredient(${idx})" class="flex items-center justify-between p-3 rounded-2xl transition cursor-pointer ${isChecked ? 'bg-lilac/20 opacity-60' : 'bg-lilac/40 hover:bg-lilac/60'}">
                                                <div class="flex items-center space-x-3">
                                                    <div class="w-5 h-5 rounded-lg flex items-center justify-center border flex-shrink-0 ${isChecked ? 'bg-violet-600 border-violet-600 text-white' : 'border-slate-300 bg-white'}">
                                                        ${isChecked ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                                                    </div>
                                                    <span class="text-xs font-medium text-slate-800 ${isChecked ? 'line-through text-slate-400' : ''}">${esc(ing.name)}</span>
                                                </div>
                                                <span class="text-xs font-bold text-violet-700 ml-3 text-right">${esc(calcAmount)} ${esc(ing.unit || '')}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- Steps Column -->
                            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm space-y-6 lg:col-span-2">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-base font-bold text-slate-900">Приготовление</h3>
                                    <button onclick="window.app.startCooking()" class="px-5 py-2.5 rounded-full bg-violet-600 hover:bg-violet-700 text-white font-semibold text-xs flex items-center space-x-2 shadow-sm transition active:scale-95">
                                        <i class="fa-solid fa-play text-[10px]"></i>
                                        <span>Начать готовить</span>
                                    </button>
                                </div>
                                <div class="space-y-4">
                                    ${recipe.steps.map((step, idx) => {
                                        const dur = parseStepSeconds(step);
                                        return `
                                        <div class="flex items-start space-x-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                            <div class="w-8 h-8 rounded-xl bg-violet-100 text-violet-700 font-extrabold text-xs flex items-center justify-center flex-shrink-0 mt-0.5">
                                                ${idx + 1}
                                            </div>
                                            <div class="pt-1 space-y-2">
                                                <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${esc(step)}</p>
                                                ${dur ? `<span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-xl bg-violet-50 text-violet-700 text-[11px] font-bold"><i class="fa-regular fa-clock text-[10px]"></i><span>${fmtDuration(dur)}</span></span>` : ''}
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>

                                <!-- Trash Can Delete Button at the bottom of recipe detail -->
                                ${!isIsolated ? `
                                    <div class="pt-6 border-t border-slate-100 flex justify-center">
                                        <button onclick="window.app.deleteRecipe('${esc(recipe.id)}', event)" class="w-12 h-12 rounded-full bg-slate-100 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition shadow-sm" title="Удалить рецепт">
                                            <i class="fa-solid fa-trash-can text-sm"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            /* ---------- редактирование рецепта ---------- */
            openEditModal(id, e) {
                if (e) e.stopPropagation();
                if (this.locked) return;
                const r = this.recipes.find(x => x.id === id);
                if (!r) return;
                this.editDraft = {
                    id: r.id,
                    title: r.title || '',
                    category: r.category || 'Горячее',
                    subcategory: r.subcategory || 'Все',
                    prepTime: r.prepTime || '',
                    difficulty: r.difficulty || 'Средне',
