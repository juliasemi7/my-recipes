                    baseServingsCount: r.baseServingsCount || 4,
                    description: r.description || '',
                    image: r.image || '',
                    ingredients: (r.ingredients || []).map(i => ({ name: i.name || '', amount: i.amount || '', unit: i.unit || '' })),
                    steps: (r.steps || []).slice()
                };
                this.renderEditModal();
            }

            editSet(field, value) {
                if (!this.editDraft) return;
                this.editDraft[field] = value;
            }

            editSetCategory(value) {
                const d = this.editDraft; if (!d) return;
                d.category = value;
                d.subcategory = 'Все';
                const sel = document.getElementById('editSubcategory');
                if (sel) sel.innerHTML = this.subcategoryOptions(d.category, d.subcategory);
            }

            subcategoryOptions(category, current) {
                const list = SUBCATEGORY_MAP[category] || ['Все'];
                const all = list.includes(current) ? list : list.concat(current);
                return all.map(s => `<option value="${esc(s)}" ${s === current ? 'selected' : ''}>${esc(s)}</option>`).join('');
            }

            editIng(i, key, value) {
                if (this.editDraft && this.editDraft.ingredients[i]) this.editDraft.ingredients[i][key] = value;
            }

            editStep(i, value) {
                if (this.editDraft) this.editDraft.steps[i] = value;
            }

            editStructural(fn, focusId) {
                const sc = document.getElementById('editScroll');
                const top = sc ? sc.scrollTop : 0;
                fn();
                this.renderEditModal();
                const sc2 = document.getElementById('editScroll');
                if (sc2) sc2.scrollTop = top;
                if (focusId) {
                    const el = document.getElementById(focusId);
                    if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
                }
            }

            editAddIng() {
                this.editStructural(() => this.editDraft.ingredients.push({ name: '', amount: '', unit: '' }), 'editIngName' + (this.editDraft.ingredients.length));
            }
            editRemoveIng(i) { this.editStructural(() => this.editDraft.ingredients.splice(i, 1)); }
            editAddStep() {
                this.editStructural(() => this.editDraft.steps.push(''), 'editStepText' + (this.editDraft.steps.length));
            }
            editRemoveStep(i) { this.editStructural(() => this.editDraft.steps.splice(i, 1)); }
            editMoveStep(i, dir) {
                const j = i + dir;
                const st = this.editDraft.steps;
                if (j < 0 || j >= st.length) return;
                this.editStructural(() => { [st[i], st[j]] = [st[j], st[i]]; });
            }

            renderEditModal() {
                const d = this.editDraft;
                const container = document.getElementById('modalContainer');
                if (!d || !container) return;
                const input = 'w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 text-sm focus:outline-none focus:border-violet-600 transition';
                const label = 'block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2';
                const rowInput = input.replace('w-full ', '');
                container.innerHTML = `
                    <div id="modalOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fadeIn">
                        <div class="bg-white rounded-3xl max-w-2xl w-full shadow-2xl relative border border-slate-100 flex flex-col max-h-[92vh]">
                            <div class="flex items-center justify-between p-6 sm:p-8 pb-4">
                                <h3 class="text-base font-bold text-slate-900">Редактирование рецепта</h3>
                                <button onclick="window.app.closeModal()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>

                            <div id="editScroll" class="flex-1 overflow-y-auto px-6 sm:px-8 pb-4 space-y-5">
                                <div>
                                    <label class="${label}">Название</label>
                                    <input type="text" value="${esc(d.title)}" oninput="window.app.editSet('title', this.value)" class="${input}">
                                </div>

                                <div>
                                    <label class="${label}">Описание</label>
                                    <textarea rows="2" oninput="window.app.editSet('description', this.value)" class="${input} resize-none">${esc(d.description)}</textarea>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="${label}">Категория</label>
                                        <select onchange="window.app.editSetCategory(this.value)" class="${input}">
                                            ${(CATEGORY_LIST.includes(d.category) ? CATEGORY_LIST : CATEGORY_LIST.concat(d.category)).map(c => `<option value="${esc(c)}" ${c === d.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="${label}">Подкатегория</label>
                                        <select id="editSubcategory" onchange="window.app.editSet('subcategory', this.value)" class="${input}">
                                            ${this.subcategoryOptions(d.category, d.subcategory)}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="${label}">Время</label>
                                        <input type="text" value="${esc(d.prepTime)}" placeholder="40 мин" oninput="window.app.editSet('prepTime', this.value)" class="${input}">
                                    </div>
                                    <div>
                                        <label class="${label}">Сложность</label>
                                        <select onchange="window.app.editSet('difficulty', this.value)" class="${input}">
                                            ${['Легко', 'Средне', 'Сложно'].map(x => `<option value="${x}" ${x === d.difficulty ? 'selected' : ''}>${x}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="${label}">Порций</label>
                                        <input type="number" min="1" max="100" value="${esc(d.baseServingsCount)}" oninput="window.app.editSet('baseServingsCount', this.value)" class="${input}">
                                    </div>
                                    <div>
                                        <label class="${label}">Ссылка на фото</label>
                                        <input type="text" value="${esc(d.image)}" placeholder="https://..." oninput="window.app.editSet('image', this.value)" class="${input}">
                                    </div>
                                </div>

                                <div>
                                    <label class="${label}">Ингредиенты</label>
                                    <div class="space-y-2">
                                        ${d.ingredients.map((ing, i) => `
                                            <div class="flex items-center space-x-2">
                                                <input id="editIngName${i}" type="text" value="${esc(ing.name)}" placeholder="Название" oninput="window.app.editIng(${i}, 'name', this.value)" class="${rowInput} flex-1 min-w-0">
                                                <input type="text" value="${esc(ing.amount)}" placeholder="Кол-во" oninput="window.app.editIng(${i}, 'amount', this.value)" class="${rowInput} w-24 flex-shrink-0">
                                                <input type="text" value="${esc(ing.unit)}" placeholder="Ед." oninput="window.app.editIng(${i}, 'unit', this.value)" class="${rowInput} w-20 flex-shrink-0">
                                                <button onclick="window.app.editRemoveIng(${i})" class="w-10 h-10 flex-shrink-0 rounded-xl bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition" title="Удалить">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <button onclick="window.app.editAddIng()" class="mt-3 px-4 py-2 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-xs flex items-center space-x-2 transition">
                                        <i class="fa-solid fa-plus text-[10px]"></i><span>Добавить ингредиент</span>
                                    </button>
                                </div>

                                <div>
                                    <label class="${label}">Шаги приготовления</label>
                                    <div class="space-y-2">
                                        ${d.steps.map((st, i) => `
                                            <div class="flex items-start space-x-2">
                                                <div class="w-8 h-8 mt-1 rounded-xl bg-violet-100 text-violet-700 font-extrabold text-xs flex items-center justify-center flex-shrink-0">${i + 1}</div>
                                                <textarea id="editStepText${i}" rows="2" oninput="window.app.editStep(${i}, this.value)" class="${rowInput} resize-y flex-1 min-w-0">${esc(st)}</textarea>
                                                <div class="flex flex-col space-y-1 flex-shrink-0">
                                                    <button onclick="window.app.editMoveStep(${i}, -1)" class="w-8 h-6 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-500 flex items-center justify-center transition ${i === 0 ? 'opacity-30 pointer-events-none' : ''}" title="Выше"><i class="fa-solid fa-chevron-up text-[10px]"></i></button>
                                                    <button onclick="window.app.editMoveStep(${i}, 1)" class="w-8 h-6 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-500 flex items-center justify-center transition ${i === d.steps.length - 1 ? 'opacity-30 pointer-events-none' : ''}" title="Ниже"><i class="fa-solid fa-chevron-down text-[10px]"></i></button>
                                                    <button onclick="window.app.editRemoveStep(${i})" class="w-8 h-6 rounded-lg bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition" title="Удалить шаг"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <button onclick="window.app.editAddStep()" class="mt-3 px-4 py-2 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-xs flex items-center space-x-2 transition">
                                        <i class="fa-solid fa-plus text-[10px]"></i><span>Добавить шаг</span>
                                    </button>
                                </div>
                            </div>

                            <div class="p-6 sm:p-8 pt-4 border-t border-slate-100 flex items-center space-x-3">
                                <button onclick="window.app.closeModal()" class="px-6 py-3.5 rounded-2xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-sm transition">Отмена</button>
                                <button id="editSaveBtn" onclick="window.app.saveEdit()" class="flex-1 py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold text-sm shadow-sm transition active:scale-95">Сохранить</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            saveEdit() {
                const d = this.editDraft;
                if (!d || this.locked) return;
                const recipe = this.recipes.find(r => r.id === d.id);
                if (!recipe) return;

                const title = String(d.title || '').trim();
                const ingredients = d.ingredients
                    .map(i => ({ name: String(i.name || '').trim(), amount: String(i.amount || '').trim(), unit: String(i.unit || '').trim() }))
                    .filter(i => i.name)
                    .map(i => ({ ...i, amount: i.amount || 'по вкусу' }));
                const steps = d.steps.map(x => String(x || '').trim()).filter(Boolean);
                const image = String(d.image || '').trim();

                if (!title) { this.showToast('Укажите название рецепта', 'error'); return; }
                if (!ingredients.length) { this.showToast('Добавьте хотя бы один ингредиент', 'error'); return; }
                if (!steps.length) { this.showToast('Добавьте хотя бы один шаг', 'error'); return; }
                if (image && !/^https?:\/\/\S+$/i.test(image)) { this.showToast('Ссылка на фото должна начинаться с http:// или https://', 'error'); return; }

                const base = Math.min(100, Math.max(1, parseInt(d.baseServingsCount, 10) || 4));
                const baseChanged = base !== recipe.baseServingsCount;

                recipe.title = title;
                recipe.description = String(d.description || '').trim();
                recipe.category = d.category;
                recipe.subcategory = d.subcategory || 'Все';
                recipe.prepTime = String(d.prepTime || '').trim() || '30 мин';
                recipe.difficulty = d.difficulty;
                recipe.baseServingsCount = base;
                recipe.servings = pluralPortions(base);
                recipe.image = image || FALLBACK_IMG;
                recipe.ingredients = ingredients;
                recipe.steps = steps;

                this.saveRecipes();
                this.editDraft = null;
                this.closeModal();
                this.checkedIngredients = {};
                if (baseChanged || !this.currentServings) this.currentServings = base;
                this.showToast('Изменения сохранены');
                this.render();
            }

            /* ---------- пошаговое приготовление с таймерами ---------- */
            startCooking() {
                const recipe = this.locked ? this.isolatedRecipe : this.recipes.find(r => r.id === this.selectedRecipeId);
                if (!recipe || !recipe.steps.length) return;
                this.closeCook(true);
                this.cook = {
                    recipe,
                    steps: recipe.steps,
                    idx: 0,
                    timers: {},
                    showIng: false
                };
                document.body.style.overflow = 'hidden';
                try {
                    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { this.wakeLock = l; }).catch(() => {});
                } catch (e) { /* ignore */ }
                this.renderCook();
            }

            closeCook(silent) {
                if (!this.cook) return;
                const running = Object.values(this.cook.timers).some(t => t.running);
                if (!silent && running && !confirm('Таймеры ещё идут. Закрыть режим приготовления?')) return;
                this.cook = null;
                clearInterval(this.cookInterval);
                this.cookInterval = null;
                const c = document.getElementById('cookContainer');
                if (c) c.innerHTML = '';
                document.body.style.overflow = '';
                try { if (this.wakeLock) { this.wakeLock.release(); this.wakeLock = null; } } catch (e) { /* ignore */ }
            }

            getTimer(i) {
                const c = this.cook;
                if (!c.timers[i]) {
                    const auto = parseStepSeconds(c.steps[i]) || 0;
                    c.timers[i] = { total: auto, remaining: auto, running: false, endAt: 0, done: false, ack: false };
                }
                return c.timers[i];
            }

            timerLeft(t) {
                return t.running ? Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000)) : t.remaining;
            }

            unlockAudio() {
                try {
                    if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                } catch (e) { /* ignore */ }
            }

            playAlarm() {
                try {
                    this.unlockAudio();
                    const ctx = this.audioCtx;
                    [0, 0.35, 0.7, 1.2, 1.55, 1.9].forEach(offset => {
                        const o = ctx.createOscillator(), g = ctx.createGain();
                        o.type = 'sine';
                        o.frequency.value = 880;
                        o.connect(g); g.connect(ctx.destination);
                        const now = ctx.currentTime + offset;
                        g.gain.setValueAtTime(0.0001, now);
                        g.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
                        o.start(now); o.stop(now + 0.3);
                    });
                } catch (e) { /* ignore */ }
                try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) { /* ignore */ }
            }

            ensureCookTicker() {
                const any = this.cook && Object.values(this.cook.timers).some(t => t.running);
                if (any && !this.cookInterval) this.cookInterval = setInterval(() => this.cookTick(), 250);
                if (!any && this.cookInterval) { clearInterval(this.cookInterval); this.cookInterval = null; }
            }

            cookTick() {
                const c = this.cook;
                if (!c) { clearInterval(this.cookInterval); this.cookInterval = null; return; }
                let finishedAny = false;
                Object.keys(c.timers).forEach(k => {
                    const t = c.timers[k];
                    if (t.running && Date.now() >= t.endAt) {
                        t.running = false; t.done = true; t.remaining = 0; t.ack = (parseInt(k, 10) === c.idx);
                        finishedAny = true;
                        this.playAlarm();
                        this.showToast(`Шаг ${parseInt(k, 10) + 1}: время вышло!`);
                    }
                });
                this.ensureCookTicker();
                if (finishedAny) { this.renderCook(); return; }
                this.updateCookTimerDOM();
            }

            updateCookTimerDOM() {
                const c = this.cook;
                if (!c) return;
                const t = this.getTimer(c.idx);
                const left = this.timerLeft(t);
                const time = document.getElementById('cookTime');
                const ring = document.getElementById('cookRing');
                const state = document.getElementById('cookState');
                if (time) time.textContent = fmtClock(left);
                if (ring && t.total > 0) ring.setAttribute('stroke-dashoffset', String(439.82 * (1 - Math.min(1, left / t.total))));
                if (state) state.textContent = this.timerStateText(t, left);
                document.querySelectorAll('[data-chip]').forEach(el => {
                    const ct = c.timers[el.getAttribute('data-chip')];
                    if (ct) el.textContent = ct.done ? 'время вышло' : fmtClock(this.timerLeft(ct));
                });
            }

            timerStateText(t, left) {
                if (t.done) return 'Время вышло!';
                if (t.running) return 'Идёт';
                if (left < t.total) return 'Пауза';
                return 'Готов к запуску';
            }

            cookToggle() {
                const c = this.cook; if (!c) return;
                const t = this.getTimer(c.idx);
                if (t.total <= 0) return;
                this.unlockAudio();
                if (t.running) {
                    t.remaining = this.timerLeft(t);
                    t.running = false;
                } else {
                    if (t.done || t.remaining <= 0) { t.remaining = t.total; t.done = false; }
                    t.endAt = Date.now() + t.remaining * 1000;
                    t.running = true;
                    t.done = false;
                }
                this.ensureCookTicker();
                this.renderCook();
            }

            cookReset() {
                const c = this.cook; if (!c) return;
                const t = this.getTimer(c.idx);
                t.running = false; t.done = false; t.remaining = t.total;
                this.ensureCookTicker();
                this.renderCook();
            }

            cookAdjust(deltaSec) {
                const c = this.cook; if (!c) return;
                const t = this.getTimer(c.idx);
                if (t.total <= 0) return;
                const newTotal = Math.max(60, t.total + deltaSec);
                const applied = newTotal - t.total;
                t.total = newTotal;
                if (t.running) {
                    t.endAt += applied * 1000;
                    if (t.endAt - Date.now() < 5000) t.endAt = Date.now() + 5000;
                } else {
                    t.remaining = Math.max(1, t.remaining + applied);
                    if (t.done) { t.done = false; t.remaining = t.total; }
                }
                this.renderCook();
            }

            cookAddTimer() {
                const c = this.cook; if (!c) return;
                const t = this.getTimer(c.idx);
                t.total = 300; t.remaining = 300; t.done = false; t.running = false;
                this.renderCook();
            }

            cookGo(i) {
                const c = this.cook; if (!c || i < 0 || i >= c.steps.length) return;
                c.idx = i;
                const t = c.timers[i];
                if (t && t.done) t.ack = true;
                this.renderCook();
                const body = document.getElementById('cookScroll');
                if (body) body.scrollTo({ top: 0 });
            }

            cookNext() {
                const c = this.cook; if (!c) return;
                if (c.idx >= c.steps.length - 1) {
                    this.closeCook();
                    if (!this.cook) this.showToast('Приятного аппетита! 🍽');
                    return;
                }
                this.cookGo(c.idx + 1);
            }

            cookPrev() {
                const c = this.cook; if (!c) return;
                this.cookGo(c.idx - 1);
            }

            cookToggleIngredients() {
                const c = this.cook; if (!c) return;
                c.showIng = !c.showIng;
                this.renderCook();
            }

            renderCook() {
                const c = this.cook;
                const container = document.getElementById('cookContainer');
                if (!c || !container) return;
                const { recipe, steps, idx } = c;
                const t = this.getTimer(idx);
                if (t.done) t.ack = true;
                const left = this.timerLeft(t);
                const isLast = idx === steps.length - 1;
                const chips = steps.map((_, i) => i).filter(i => {
                    if (i === idx) return false;
                    const ct = c.timers[i];
                    return ct && (ct.running || (ct.done && !ct.ack));
                });
                const base = recipe.baseServingsCount || 4;
                const mult = (this.currentServings || base) / base;
                const ringColor = t.done ? '#E11D48' : '#7C3AED';
                const frac = t.total > 0 ? Math.min(1, left / t.total) : 0;

                const timerCard = t.total > 0 ? `
                    <div class="bg-white rounded-3xl border ${t.done ? 'border-rose-400' : 'border-slate-200/80'} shadow-sm p-6 sm:p-8 flex flex-col items-center space-y-6 ${t.done ? 'animate-pulse' : ''}">
                        <div class="relative w-44 h-44">
                            <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90">
                                <circle cx="80" cy="80" r="70" fill="none" stroke="#E2E8F0" stroke-width="10"></circle>
                                <circle id="cookRing" cx="80" cy="80" r="70" fill="none" stroke="${ringColor}" stroke-width="10" stroke-linecap="round" stroke-dasharray="439.82" stroke-dashoffset="${439.82 * (1 - frac)}" style="transition: stroke-dashoffset 0.25s linear"></circle>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <div id="cookTime" class="text-3xl font-extrabold tracking-tight text-slate-900" style="font-variant-numeric: tabular-nums">${fmtClock(left)}</div>
                                <div id="cookState" class="text-[11px] font-bold uppercase tracking-wider ${t.done ? 'text-rose-600' : 'text-violet-600'} mt-1">${this.timerStateText(t, left)}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="window.app.cookAdjust(-60)" class="w-11 h-11 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-bold transition" title="−1 минута">−1</button>
                            <button onclick="window.app.cookToggle()" class="px-7 py-3 rounded-full bg-violet-600 hover:bg-violet-700 text-white font-bold text-sm shadow-sm transition active:scale-95 flex items-center space-x-2">
                                <i class="fa-solid ${t.running ? 'fa-pause' : 'fa-play'} text-xs"></i>
                                <span>${t.running ? 'Пауза' : t.done ? 'Заново' : left < t.total ? 'Продолжить' : 'Старт'}</span>
                            </button>
                            <button onclick="window.app.cookReset()" class="w-11 h-11 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 transition flex items-center justify-center" title="Сбросить">
                                <i class="fa-solid fa-rotate-left text-xs"></i>
                            </button>
                            <button onclick="window.app.cookAdjust(60)" class="w-11 h-11 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-bold transition" title="+1 минута">+1</button>
                        </div>
                        <div class="text-[11px] text-slate-500">Время для этого шага: ${fmtDuration(t.total)}</div>
                    </div>
                ` : `
                    <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 flex items-center justify-between">
                        <span class="text-xs text-slate-500">Для этого шага время не указано</span>
                        <button onclick="window.app.cookAddTimer()" class="px-4 py-2 rounded-full bg-violet-50 hover:bg-violet-100 text-violet-700 font-semibold text-xs flex items-center space-x-2 transition">
                            <i class="fa-regular fa-clock text-[11px]"></i>
                            <span>Поставить таймер</span>
                        </button>
                    </div>
                `;

                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-50 flex flex-col">
                        <div class="bg-white/80 backdrop-blur-md border-b border-slate-200/80">
                            <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                                <button onclick="window.app.closeCook()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition" title="Закрыть">
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>
                                <div class="min-w-0 px-4 text-center">
                                    <div class="text-[11px] font-bold uppercase tracking-wider text-violet-600">Шаг ${idx + 1} из ${steps.length}</div>
                                    <div class="text-xs font-semibold text-slate-800 truncate">${esc(recipe.title)}</div>
                                </div>
                                <button onclick="window.app.cookToggleIngredients()" class="px-4 py-2 rounded-full ${c.showIng ? 'bg-violet-600 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'} font-semibold text-xs transition">Состав</button>
                            </div>
                            <div class="max-w-3xl mx-auto px-4 sm:px-6 pb-3 flex items-center space-x-1.5">
                                ${steps.map((_, i) => `<button onclick="window.app.cookGo(${i})" class="h-1.5 flex-1 rounded-full transition ${i < idx ? 'bg-violet-600' : i === idx ? 'bg-lime' : 'bg-slate-200'}" title="Шаг ${i + 1}"></button>`).join('')}
                            </div>
                        </div>

                        <div id="cookScroll" class="flex-1 overflow-y-auto">
                            <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 space-y-5">
                                ${chips.length ? `
                                    <div class="flex flex-wrap gap-2">
                                        ${chips.map(i => {
                                            const ct = c.timers[i];
                                            return `<button onclick="window.app.cookGo(${i})" class="px-3 py-2 rounded-2xl ${ct.done ? 'bg-rose-50 text-rose-600' : 'bg-violet-50 text-violet-700'} text-[11px] font-bold flex items-center space-x-2">
                                                <i class="fa-regular fa-clock text-[10px]"></i>
                                                <span>Шаг ${i + 1}</span>
                                                <span data-chip="${i}">${ct.done ? 'время вышло' : fmtClock(this.timerLeft(ct))}</span>
                                            </button>`;
                                        }).join('')}
                                    </div>` : ''}

                                ${c.showIng ? `
                                    <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-5 space-y-2">
                                        ${recipe.ingredients.map(ing => `
                                            <div class="flex items-center justify-between text-xs">
                                                <span class="font-medium text-slate-800">${esc(ing.name)}</span>
                                                <span class="font-bold text-violet-700 ml-3 text-right">${esc(scaleAmount(ing.amount, mult))} ${esc(ing.unit || '')}</span>
                                            </div>`).join('')}
                                    </div>` : ''}

                                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 sm:p-8 flex items-start space-x-4">
                                    <div class="w-10 h-10 rounded-2xl bg-violet-100 text-violet-700 font-extrabold text-sm flex items-center justify-center flex-shrink-0">${idx + 1}</div>
                                    <p class="text-lg sm:text-2xl text-slate-800 leading-relaxed font-medium">${esc(steps[idx])}</p>
                                </div>

                                ${timerCard}
                            </div>
                        </div>

                        <div class="bg-white/80 backdrop-blur-md border-t border-slate-200/80">
                            <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between space-x-3">
                                <button onclick="window.app.cookPrev()" ${idx === 0 ? 'disabled' : ''} class="px-6 py-3.5 rounded-2xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-sm flex items-center space-x-2 transition ${idx === 0 ? 'opacity-40 pointer-events-none' : ''}">
                                    <i class="fa-solid fa-arrow-left text-xs"></i>
                                    <span>Назад</span>
                                </button>
                                <button onclick="window.app.cookNext()" class="flex-1 py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold text-sm shadow-sm transition active:scale-95 flex items-center justify-center space-x-2">
                                    <span>${isLast ? 'Готово!' : 'Дальше'}</span>
                                    <i class="fa-solid ${isLast ? 'fa-check' : 'fa-arrow-right'} text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            selectCategory(cat) {
                if (this.locked) return;
                this.selectedCategory = cat;
                this.selectedSubcategory = 'Все';
                this.render();
            }

            selectSubcategory(sub) {
                if (this.locked) return;
                this.selectedSubcategory = sub;
                this.render();
            }

            handleSearch(query) {
                if (this.locked) return;
                this.searchQuery = query;
                this.render();
            }

            adjustServings(delta) {
                const recipe = this.locked ? this.isolatedRecipe : this.recipes.find(r => r.id === this.selectedRecipeId);
                const base = (recipe && recipe.baseServingsCount) || 4;
                this.currentServings = Math.min(99, Math.max(1, (this.currentServings || base) + delta));
                this.render();
            }

            toggleIngredient(idx) {
                this.checkedIngredients[idx] = !this.checkedIngredients[idx];
                this.render();
            }
        }

        window.onload = function() {
            window.app = new RecipeApp();
        };
    </script>
</body>
</html>
